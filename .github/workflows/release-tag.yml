name: Tag Release

on:
  push:
    branches: [main]
    paths:
      - 'appPackage/manifest.json'

permissions:
  contents: write

jobs:
  check:
    name: Check Release Commit
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check commit and extract version
        id: check
        run: |
          msg=$(git log -1 --format='%s')
          if echo "$msg" | grep -qE '^release: v'; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            version=$(jq -r '.version' appPackage/manifest.json)
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Commit '$msg' is not a release commit; skipping tag and release."
          fi

  tag:
    name: Tag and Publish Release
    needs: check
    if: needs.check.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    env:
      ATK_TELEMETRY: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check if tag already exists
        id: tag-check
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag
        if: steps.tag-check.outputs.exists == 'false'
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Check if release already exists
        id: release-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.release-check.outputs.exists == 'false'
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        if: steps.release-check.outputs.exists == 'false'
        run: npm ci

      - name: Install atk CLI
        if: steps.release-check.outputs.exists == 'false'
        run: npm install -g @microsoft/m365agentstoolkit-cli@1.1.18

      - name: Build
        if: steps.release-check.outputs.exists == 'false'
        run: npm run build

      - name: Validate manifest
        if: steps.release-check.outputs.exists == 'false'
        run: atk validate --manifest-file ./appPackage/manifest.json --env dev

      - name: Package
        if: steps.release-check.outputs.exists == 'false'
        run: atk package --env dev

      - name: Rename package
        if: steps.release-check.outputs.exists == 'false'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: mv appPackage/build/appPackage.dev.zip "elastic-copilot-cowork-${VERSION}.zip"

      - name: Create GitHub Release
        if: steps.release-check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "v${VERSION}" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md) for details." \
            "elastic-copilot-cowork-${VERSION}.zip"
