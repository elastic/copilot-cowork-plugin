name: Tag Release

on:
  push:
    branches: [main]
    paths:
      - 'appPackage/manifest.json'

jobs:
  check:
    name: Check Version Bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(jq -r '.version' appPackage/manifest.json)
          tag="v${version}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch push; cannot compare versions."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prev_version=$(git show "${BEFORE}:appPackage/manifest.json" | jq -r '.version')

          echo "Previous version: $prev_version"
          echo "Current version:  $version"

          if [ "$version" = "$prev_version" ]; then
            echo "Version unchanged ($version); not a release commit."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "Release '$tag' already exists; skipping."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version bumped $prev_version → $version; proceeding with release."
            {
              echo "is_release=true"
              echo "version=$version"
              echo "tag=$tag"
            } >> "$GITHUB_OUTPUT"
          fi

  tag:
    name: Tag and Publish Release
    needs: check
    if: needs.check.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ATK_TELEMETRY: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install atk CLI
        run: npm install -g @microsoft/m365agentstoolkit-cli@1.1.18

      - name: Build
        run: npm run build

      - name: Validate manifest
        run: atk validate --manifest-file ./appPackage/manifest.json

      - name: Package
        run: atk package --manifest-file ./appPackage/manifest.json --output-package-file ./appPackage/build/appPackage.dev.zip --output-folder ./appPackage/build

      - name: Rename package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: mv appPackage/build/appPackage.dev.zip "elastic-copilot-cowork-${VERSION}.zip"

      - name: Create git tag
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rev-parse "$TAG" >/dev/null 2>&1 || {
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "v${VERSION}" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md) for details." \
            "elastic-copilot-cowork-${VERSION}.zip"
